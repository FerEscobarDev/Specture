name: Release

# Publishes (or updates) the GitHub Release for a pushed `v*` tag.
# Notes come from the README changelog section `### v<version> — <title>`
# (extracted by scripts/bump-version.js), so the changelog is the single
# source of release notes. Runs its own checks so a bad tag never publishes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Release contract
        run: |
          node scripts/bump-version.js --check
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./plugin.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match plugin.json version $VERSION"
            exit 1
          fi

      - name: Release notes from the README changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/bump-version.js --title "$VERSION" > title.txt
          node scripts/bump-version.js --notes "$VERSION" > notes.md
          echo "Title: $(cat title.txt)"

      # Only the highest version tag is marked "Latest". Without an explicit flag GitHub marks
      # whichever release was published last, so publishing an older tag (e.g. a backfill)
      # would steal "Latest" from the newest version.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="$(cat title.txt)"
          HIGHEST="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ "$GITHUB_REF_NAME" = "$HIGHEST" ]; then LATEST=true; else LATEST=false; fi
          echo "Latest: $LATEST (highest tag: $HIGHEST)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file notes.md --latest="$LATEST"
          else
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file notes.md --verify-tag --latest="$LATEST"
          fi
