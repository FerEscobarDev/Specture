# Specture — Project Settings
# Owner: the framework. Written by `/specture:setup`; advanced by `/specture:doctor migrate`.
# Flat `key: value` file (no nesting). Read by hooks, skills and the doctor.
# Projects created before v1.15.0 keep these toggles in conventions.md §10 — the framework
# still reads them there until `/specture:doctor migrate` moves them here.

schema_version: "[X.Y.Z]"   # Specture project schema (= plugin version at setup / last migration). /setup fills it.

profile: custom             # lean | full | custom
                            # lean   = hooks on, context7/docs_index/knowledge off (minimal footprint)
                            # full   = everything on
                            # custom = the individual toggles below

hooks.enabled: false                      # TDD Honesty Gate (PreToolUse deny on sealed tests)
context7.enabled: false                   # Context7 MCP in code-reviewer (Dimension 5) and modernize (gap analysis)
docs_index.enabled: true                  # Docs Index Resolution when .specture/docs-index.yml exists; agents never read the index
docs_index.max_entries_per_dispatch: 3    # hard cap of indexed docs passed to ONE agent dispatch
knowledge.enabled: false                  # opt-in knowledge-capture prompts (build Step 8.5, debug Phase 4.5)
compliance_review.enabled: true           # compliance review when a milestone closes (/specture:compliance-review); honoured under every profile
mutation.enabled: false                   # build Step 6 runs stack.yml `quality.commands.mutation` on the spec's production files and hands the raw report to the code-reviewer; needs the tool installed (any language — see docs/quality-catalog.md); honoured under every profile
tdd.level: strict                         # strict | essential | none — how much test discipline the build loop enforces; honoured under every profile
                                          #   strict    = RED for every AC/BR/EC, seal, honesty gate, full suite at the baseline and Step 7 (production projects)
                                          #   essential = same loop, fewer tests: one test per AC only, no test+/test- variants, no mandatory guards, no mutation (small or internal projects)
                                          #   none      = spec → implement → review → verify, no RED: the seal still protects the spec and the allowed paths; Step 7 = type_check / lint / format_check + the existing suite as regression (experiments). Not TDD — the code-reviewer is the only verifier
                                          # The epic coordinator reads it when it opens an epic and freezes it in _planning.md (`TDD_LEVEL`): a change applies to the next epic, never to the running one
